<!-- ============================================================
     PAGE: HISTORY
     ============================================================ -->
<div class="card">
    <div class="card-title flex-between">
        <span><i class="fas fa-clock-rotate-left"></i> Transaction History (Last 30)</span>
        <button class="btn btn-outline btn-sm" id="bulkDeleteModeBtn" style="width:auto;padding:4px 10px;font-size:12px;">
            <i class="fas fa-trash-alt"></i> Delete Bulk
        </button>
    </div>

    <!-- Filters -->
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end;">
        <div style="flex:1;min-width:120px;">
            <label style="font-size:12px;color:var(--text-muted);">Person</label>
            <select class="form-control" id="filterPerson" style="padding:6px 10px;font-size:13px;">
                <option value="">All</option>
            </select>
        </div>
        <div style="flex:1;min-width:120px;">
            <label style="font-size:12px;color:var(--text-muted);">Date</label>
            <input type="date" class="form-control" id="filterDate" style="padding:6px 10px;font-size:13px;">
        </div>
        <div>
            <button class="btn btn-outline btn-sm" id="resetFilterBtn" style="padding:7px 16px;height:35px;"><i class="fas fa-rotate-left"></i> Reset</button>
        </div>
    </div>

    <!-- Bulk Action Controls (Hidden by Default) -->
    <div id="historyBulkToolbar" style="display:none;background:var(--bg);padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:12px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;user-select:none;">
                <input type="checkbox" id="selectAllHistoryBulk" style="width:18px;height:18px;accent-color:var(--danger);cursor:pointer;">
                Select All
            </label>
            <div id="bulkSelectionCount" style="font-weight:600;font-size:13px;color:var(--text-secondary);">
                0 entries selected for deletion
            </div>
        </div>
        <div style="display:flex;gap:8px;justify-content:center;">
            <button class="btn btn-danger btn-sm" id="confirmHistoryBulkDeleteBtn" style="width:auto;padding:6px 16px;" disabled>
                <i class="fas fa-trash"></i> Delete
            </button>
            <button class="btn btn-outline btn-sm" id="cancelHistoryBulkDeleteBtn" style="width:auto;padding:6px 16px;">
                Cancel
            </button>
        </div>
    </div>

    <div id="historyContainer">
        <div class="empty-state">
            <i class="fas fa-receipt"></i>
            <p>No transactions yet.</p>
        </div>
    </div>
</div>

<script>
    const $ = (sel) => root.querySelector(sel);
    const $$ = (sel) => root.querySelectorAll(sel);
    const { escapeHtml, getTodayStr } = App.util;

    const historyContainer = $('#historyContainer');
    const filterPerson = $('#filterPerson');
    const filterDate = $('#filterDate');
    const resetFilterBtn = $('#resetFilterBtn');
    const bulkDeleteModeBtn = $('#bulkDeleteModeBtn');
    const historyBulkToolbar = $('#historyBulkToolbar');
    const bulkSelectionCount = $('#bulkSelectionCount');
    const selectAllHistoryBulk = $('#selectAllHistoryBulk');
    const confirmBtn = $('#confirmHistoryBulkDeleteBtn');
    const cancelBtn = $('#cancelHistoryBulkDeleteBtn');

    let isBulkDeleteMode = false;
    let selectedTxRows = new Set();
    let currentHistoryData = [];   // what is currently shown (after filters)
    let rawHistoryCache = [];      // everything last fetched from the server

    // ============================================================
    //  FETCH + FILTER
    // ============================================================
    function populateFilterDropdown() {
        const currentVal = filterPerson.value;
        let html = '<option value="">All</option>';
        App.state.members.forEach(m => {
            html += `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`;
        });
        filterPerson.innerHTML = html;
        if (currentVal && App.state.members.includes(currentVal)) filterPerson.value = currentVal;
    }

    // Hits the server only when opening the tab or after deleting items
    async function fetchHistory() {
        try {
            const data = await App.api('getTransactionHistory', {});
            rawHistoryCache = data || [];
            applyHistoryFilters();
        } catch (e) {}
    }

    // Instant client-side filter
    function applyHistoryFilters() {
        const pFilter = filterPerson.value ? filterPerson.value.toLowerCase() : '';
        const dFilter = filterDate.value || '';
        const filtered = rawHistoryCache.filter(tx => {
            const matchPerson = !pFilter || (tx.person && tx.person.toLowerCase() === pFilter);
            const matchDate = !dFilter || tx.date === dFilter;
            return matchPerson && matchDate;
        });
        renderHistory(filtered);
    }

    // ============================================================
    //  RENDER
    // ============================================================
    function renderHistory(transactions) {
        currentHistoryData = transactions || [];
        if (!transactions || transactions.length === 0) {
            historyContainer.innerHTML = `<div class="empty-state"><i class="fas fa-receipt"></i><p>No transactions match your filters.</p></div>`;
            return;
        }

        let html = '<div class="history-list" style="display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;padding-right:4px;">';

        transactions.forEach(tx => {
            const amountClass = tx.type === 'Credit' ? 'positive' : 'negative';
            const sign = tx.type === 'Credit' ? '+' : '-';
            const dateStr = tx.date ? new Date(tx.date).toLocaleDateString('en-IN') : 'No date';
            const isChecked = selectedTxRows.has(tx.row);

            html += `
                <div class="history-item" style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg);border-radius:var(--radius-sm);border:1px solid var(--border);">
                    ${isBulkDeleteMode ? `
                        <input type="checkbox" class="history-checkbox" data-row="${tx.row}" ${isChecked ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--danger);cursor:pointer;margin-right:10px;flex-shrink:0;">
                    ` : ''}
                    <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;">
                        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                            <span style="font-weight:600;font-size:14px;">${escapeHtml(tx.person)}</span>
                            <span style="font-size:10px;background:var(--card-bg);padding:1px 8px;border-radius:10px;border:1px solid var(--border);">${escapeHtml(tx.type)}</span>
                            <span style="font-size:10px;color:var(--text-muted);">${escapeHtml(tx.category)}</span>
                        </div>
                        <div style="display:flex;gap:12px;font-size:11px;color:var(--text-muted);flex-wrap:wrap;">
                            <span><i class="far fa-calendar"></i> ${dateStr}</span>
                            ${tx.time ? `<span><i class="far fa-clock"></i> ${escapeHtml(tx.time)}</span>` : ''}
                            <span><i class="far fa-user"></i> ${escapeHtml(tx.registrar || 'System')}</span>
                            ${tx.notes ? `<span><i class="far fa-note-sticky"></i> ${escapeHtml(tx.notes)}</span>` : ''}
                        </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                        <span class="member-balance ${amountClass}" style="font-size:15px;">
                            <span class="currency">₹</span>${sign}${Math.abs(tx.amount).toFixed(0)}
                        </span>
                        ${!isBulkDeleteMode ? `
                            <button class="del-tx-btn" data-row="${tx.row}" style="background:none;border:none;color:var(--text-muted);font-size:16px;padding:6px 8px;cursor:pointer;border-radius:6px;touch-action:manipulation;" aria-label="Delete">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;
        });
        html += '</div>';
        historyContainer.innerHTML = html;

        // Single delete buttons
        $$('.del-tx-btn').forEach(btn => {
            btn.addEventListener('click', async function (e) {
                e.stopPropagation();
                const row = parseInt(this.dataset.row);
                const item = this.closest('.history-item');
                const nameSpan = item ? item.querySelector('span:first-child') : null;
                const name = nameSpan ? nameSpan.innerText : 'this transaction';
                if (!confirm(`Delete transaction for ${name}?`)) return;
                try {
                    const result = await App.api('deleteTransaction', row);
                    if (result.success) {
                        App.toast(result.message, 'success');
                        fetchHistory();
                        App.loadDashboard().catch(() => {});
                    } else {
                        App.toast(result.message || 'Failed to delete transaction.', 'error');
                    }
                } catch (err) {}
            });
        });

        // Bulk checkboxes
        $$('.history-checkbox').forEach(cb => {
            cb.addEventListener('change', function () {
                const row = parseInt(this.dataset.row);
                if (this.checked) selectedTxRows.add(row);
                else selectedTxRows.delete(row);
                updateHistoryBulkCount();
            });
        });
    }

    // ============================================================
    //  BULK DELETE MODE
    // ============================================================
    function updateHistoryBulkCount() {
        const count = selectedTxRows.size;
        const totalVisible = currentHistoryData.length;

        bulkSelectionCount.textContent = `${count} ${count === 1 ? 'entry' : 'entries'} selected for deletion`;
        confirmBtn.disabled = count === 0;

        if (totalVisible > 0 && count === totalVisible) {
            selectAllHistoryBulk.checked = true;
            selectAllHistoryBulk.indeterminate = false;
        } else if (count > 0 && count < totalVisible) {
            selectAllHistoryBulk.checked = false;
            selectAllHistoryBulk.indeterminate = true;
        } else {
            selectAllHistoryBulk.checked = false;
            selectAllHistoryBulk.indeterminate = false;
        }
    }

    function exitHistoryBulkMode() {
        isBulkDeleteMode = false;
        selectedTxRows.clear();
        selectAllHistoryBulk.checked = false;
        selectAllHistoryBulk.indeterminate = false;
        historyBulkToolbar.style.display = 'none';
        bulkDeleteModeBtn.style.display = 'inline-flex';
        renderHistory(currentHistoryData);
    }

    bulkDeleteModeBtn.addEventListener('click', () => {
        isBulkDeleteMode = true;
        selectedTxRows.clear();
        historyBulkToolbar.style.display = 'block';
        bulkDeleteModeBtn.style.display = 'none';
        updateHistoryBulkCount();
        renderHistory(currentHistoryData);
    });

    selectAllHistoryBulk.addEventListener('change', function () {
        if (this.checked) currentHistoryData.forEach(tx => selectedTxRows.add(tx.row));
        else selectedTxRows.clear();
        $$('.history-checkbox').forEach(cb => { cb.checked = this.checked; });
        updateHistoryBulkCount();
    });

    cancelBtn.addEventListener('click', exitHistoryBulkMode);

    confirmBtn.addEventListener('click', async () => {
        const rowsToDelete = Array.from(selectedTxRows);
        if (rowsToDelete.length === 0) return;
        if (!confirm(`Are you sure you want to delete ${rowsToDelete.length} selected transaction(s)?`)) return;

        confirmBtn.disabled = true;
        confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Deleting...';
        try {
            const result = await App.api('deleteBulkTransactions', rowsToDelete);
            if (result.success) {
                App.toast(result.message, 'success');
                exitHistoryBulkMode();
                fetchHistory();
                App.loadDashboard().catch(() => {});
            } else {
                App.toast(result.message || 'Failed to delete transactions.', 'error');
            }
        } catch (e) {
        } finally {
            confirmBtn.innerHTML = '<i class="fas fa-trash"></i> Delete';
            updateHistoryBulkCount();
        }
    });

    // ============================================================
    //  FILTER EVENTS
    // ============================================================
    filterPerson.addEventListener('change', applyHistoryFilters);
    filterDate.addEventListener('change', applyHistoryFilters);
    resetFilterBtn.addEventListener('click', () => {
        filterPerson.value = '';
        filterDate.value = getTodayStr();
        applyHistoryFilters();
    });

    // Members changed (rename / add / delete)
    App.on('members', populateFilterDropdown);

    // A transaction was added elsewhere while this page is open
    App.on('tx-changed', () => { if (App.current === 'history') fetchHistory(); });

    // ============================================================
    //  INIT + PAGE LIFECYCLE
    // ============================================================
    filterDate.value = getTodayStr();
    filterPerson.value = '';

    return {
        onShow() {
            populateFilterDropdown();
            if (!filterDate.value) filterDate.value = getTodayStr();
            return fetchHistory();
        },
        // Leaving the page cancels bulk-delete mode
        onHide() {
            if (isBulkDeleteMode) exitHistoryBulkMode();
        }
    };
</script>
